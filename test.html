<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Fifty Test Harness</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#0c1220;
    --panel:#11192b;
    --panel-2:#18233b;
    --text:#f4efe8;
    --muted:rgba(244,239,232,0.72);
    --line:rgba(244,239,232,0.14);
    --accent:#8ecae6;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    display:flex;
    overflow:hidden;
    background:
      radial-gradient(circle at top left, rgba(142,202,230,0.12), transparent 32%),
      radial-gradient(circle at bottom right, rgba(76,251,171,0.10), transparent 28%),
      var(--bg);
    color:var(--text);
    font-family:Helvetica,Verdana,Arial,sans-serif;
  }

  .shell{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    gap:14px;
    padding:16px;
  }

  .banner{
    display:flex;
    flex-wrap:wrap;
    gap:10px 14px;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    border:1px solid var(--line);
    border-radius:14px;
    background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
    backdrop-filter: blur(10px);
  }

  .banner strong{
    font-size:14px;
    letter-spacing:0.08em;
    text-transform:uppercase;
  }

  .banner span{
    color:var(--muted);
    font-size:13px;
  }

  #status{
    padding:10px 14px;
    border-radius:10px;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--muted);
    font-size:13px;
  }

  .probeControls{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }

  .probeControls[hidden],
  #probeLog[hidden]{display:none;}

  .probeControls button{
    padding:9px 12px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--panel-2);
    color:var(--text);
    cursor:pointer;
  }

  #probeLog{
    max-height:120px;
    overflow:auto;
    margin:0;
    padding:10px 14px;
    background:var(--panel);
    color:var(--muted);
    font-size:12px;
    white-space:pre-wrap;
  }

  .frameWrap{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    border-radius:18px;
    overflow:hidden;
    border:1px solid var(--line);
    background:var(--panel-2);
    box-shadow:0 24px 70px rgba(0,0,0,0.35);
  }

  iframe{
    display:block;
    flex:1;
    min-height:0;
    width:100%;
    height:100%;
    border:0;
    background:#677c73;
  }

  .hint{
    color:var(--muted);
    font-size:12px;
  }

  code{
    color:var(--accent);
  }
</style>
</head>
<body>
  <div class="shell">
    <div class="banner">
      <strong>Weekly Fifty test harness</strong>
      <span id="bannerDescription">Loads <code>index.html</code> and mocks <code>/api/getLatestQuiz</code> from <code>test-quiz-data.json</code>.</span>
      <a href="?iframe-test">Iframe probe</a>
    </div>
    <div id="status">Loading harness...</div>
    <div id="probeControls" class="probeControls" hidden>
      <button id="sameOriginProbe" type="button">Same-origin JSON</button>
      <button id="getProbe" type="button">Cross-origin GET</button>
      <button id="postProbe" type="button">Cross-origin form POST</button>
    </div>
    <pre id="probeLog" role="log" aria-live="polite" hidden></pre>
    <div class="frameWrap">
      <iframe id="preview" title="Weekly Fifty quiz preview"></iframe>
    </div>
    <div id="hint" class="hint">If local file fetches are blocked in your browser, serve this folder with a simple static server and reopen <code>test.html</code>.</div>
  </div>

  <script>
    function setupIframeProbe() {
      const apiUrl = "https://us-central1-weeklyfifty-7617b.cloudfunctions.net/getQuizForViewer";
      const status = document.getElementById("status");
      const log = document.getElementById("probeLog");
      let frame = document.getElementById("preview");
      let timer;

      document.getElementById("bannerDescription").textContent = "Iframe access diagnostic";
      document.getElementById("hint").textContent = "Forms cannot send the JSON Content-Type and body required by this API. Run this test on GitHub Pages; a load event does not mean the parent can read the response.";
      document.getElementById("probeControls").hidden = false;
      log.hidden = false;
      status.textContent = "Choose a probe. Open DevTools Network to inspect request status and frame policies.";

      function report(message) {
        log.textContent += message + "\n";
      }

      function runProbe(label, navigate) {
        clearTimeout(timer);
        log.textContent = "";
        status.textContent = label + ": waiting for iframe load...";

        const nextFrame = document.createElement("iframe");
        nextFrame.id = "preview";
        nextFrame.name = "quizResponseProbe";
        nextFrame.title = label + " response";
        frame.replaceWith(nextFrame);
        frame = nextFrame;

        frame.addEventListener("load", () => {
          clearTimeout(timer);
          report("Iframe load event fired (this does not confirm HTTP success).");
          try {
            const text = frame.contentWindow.document.body.textContent;
            const data = JSON.parse(text);
            const quiz = Array.isArray(data) ? data[0] : data.result || data;
            report("Readable JSON; questions: " + (quiz.quiz || quiz).questions.length);
            status.textContent = label + ": readable JSON.";
          } catch (error) {
            report("Parent read/parse failed: " + error.name + ": " + error.message);
            status.textContent = label + ": no readable quiz JSON.";
          }
        }, { once: true });

        timer = setTimeout(() => {
          report("No iframe load event within 10 seconds; inspect DevTools Network.");
          status.textContent = label + ": timed out.";
        }, 10000);
        navigate(frame);
      }

      window.addEventListener("message", event => {
        if (event.source !== frame.contentWindow || event.origin !== new URL(apiUrl).origin) return;
        report("Received a postMessage from the API origin (contents not displayed).");
      });

      document.getElementById("sameOriginProbe").addEventListener("click", () => {
        runProbe("Same-origin JSON", target => { target.src = "./test-quiz-data.json"; });
      });
      document.getElementById("getProbe").addEventListener("click", () => {
        runProbe("Cross-origin GET", target => { target.src = apiUrl; });
      });
      document.getElementById("postProbe").addEventListener("click", () => {
        runProbe("Cross-origin form POST", target => {
          const form = document.createElement("form");
          form.method = "POST";
          form.action = apiUrl;
          form.target = target.name;
          form.hidden = true;
          const field = document.createElement("input");
          field.name = "data";
          field.value = JSON.stringify({ active: true });
          form.appendChild(field);
          document.body.appendChild(form);
          form.submit();
          form.remove();
        });
      });
    }

    (async () => {
      const statusEl = document.getElementById("status");
      const preview = document.getElementById("preview");

      if (new URLSearchParams(location.search).has("iframe-test")) {
        setupIframeProbe();
        return;
      }

      try {
        statusEl.textContent = "Reading index.html and test-quiz-data.json...";

        const [indexHTML, quizDataText] = await Promise.all([
          fetch("./index.html", { cache: "no-store" }).then(response => {
            if (!response.ok) throw new Error("Failed to load index.html: HTTP " + response.status);
            return response.text();
          }),
          fetch("./test-quiz-data.json", { cache: "no-store" }).then(response => {
            if (!response.ok) throw new Error("Failed to load test-quiz-data.json: HTTP " + response.status);
            return response.text();
          })
        ]);

        const mockQuizPageHTML = '<!doctype html><html><head><meta charset="utf-8"><title>Mock Quiz Page</title></head><body><div>Mock quiz page</div></body></html>';
        const sourceDoc = new DOMParser().parseFromString(indexHTML, "text/html");
        const prelude = sourceDoc.createElement("script");
        prelude.textContent = [
          "(function(){",
          "  const originalFetch = window.fetch.bind(window);",
          "  const mockQuizPageHTML = " + JSON.stringify(mockQuizPageHTML) + ";",
          "  const mockQuizData = " + JSON.stringify(quizDataText) + ";",
          "  const pageUrl = 'https://theweeklyfifty.com.au/this-weeks-quiz/';",
          "  const apiPattern = /\\/api\\/getLatestQuiz/;",
          "  window.fetch = function(input, init){",
          "    const url = typeof input === 'string' ? input : (input && input.url ? input.url : String(input));",
          "    if (url === pageUrl) {",
          "      return Promise.resolve(new Response(mockQuizPageHTML, { status: 200, headers: { 'Content-Type': 'text/html; charset=utf-8' } }));",
          "    }",
          "    if (apiPattern.test(url)) {",
          "      return Promise.resolve(new Response(mockQuizData, { status: 200, headers: { 'Content-Type': 'application/json; charset=utf-8' } }));",
          "    }",
          "    return originalFetch(input, init);",
          "  };",
          "})();"
        ].join("\n");

        sourceDoc.head.insertBefore(prelude, sourceDoc.head.firstChild);

        preview.srcdoc = "<!doctype html>\n" + sourceDoc.documentElement.outerHTML;

        statusEl.textContent = "Harness ready. Open the embedded quiz below.";
      } catch (error) {
        statusEl.textContent = "Failed to initialize harness: " + (error && error.message ? error.message : String(error));
      }
    })();
  </script>
</body>
</html>
