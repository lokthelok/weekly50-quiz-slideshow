<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Night - The Weekly Fifty</title>
<style>
  :root{
    --bg:#677c73;
    --surface:#000716;
    --text:#fbe2df;
    --muted:rgba(251,226,223,0.72);
    --line:rgba(251,226,223,0.4);
    --good:#4cfbab;
    --bad:#f78da7;
    --font-main:Helvetica,Verdana,Arial,sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-main);
  }
  body{
    overflow:hidden;
    position:relative;
    transition:background 0.5s ease, color 0.3s ease;
  }

  body::before,
  body::after{
    content:"";
    position:fixed;
    inset:-20%;
    pointer-events:none;
    opacity:0;
    transition:opacity 0.4s ease;
    z-index:-2;
  }

  body::before{
    background:
      radial-gradient(circle at 20% 20%, rgba(255,0,153,0.42), transparent 24%),
      radial-gradient(circle at 80% 18%, rgba(0,238,255,0.36), transparent 26%),
      radial-gradient(circle at 30% 80%, rgba(255,242,0,0.32), transparent 24%),
      radial-gradient(circle at 75% 70%, rgba(124,77,255,0.36), transparent 24%);
    background-size:120% 120%;
  }

  body::after{
    background:
      conic-gradient(from 0deg at 50% 50%, rgba(255,0,106,0.18), rgba(0,255,247,0.18), rgba(255,230,0,0.18), rgba(124,77,255,0.18), rgba(255,0,106,0.18));
    mix-blend-mode:screen;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  button{
    font-family:var(--font-main);
    cursor:pointer;
    touch-action:manipulation;
  }

  button:focus-visible,
  a:focus-visible,
  textarea:focus-visible,
  input:focus-visible{
    outline:3px solid var(--text);
    outline-offset:2px;
  }

  #app{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
  }

  #progressTrack{
    height:6px;
    background:rgba(0,7,22,0.26);
    flex-shrink:0;
  }

  #progressFill{
    height:100%;
    background:var(--text);
    width:0%;
    transition:width 0.35s ease;
  }

  #stage{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 6vw 9vh;
    overflow-y:auto;
  }

  .slideInner{
    max-width:960px;
    width:100%;
    text-align:center;
    margin:auto;
  }

  .wordmark{
    margin:0 0 8px;
    font-size:clamp(34px,6vw,64px);
    line-height:1;
    font-weight:700;
    text-transform:uppercase;
  }

  .subtitle{
    margin:0 0 24px;
    font-size:clamp(18px,2vw,22px);
    color:var(--text);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.06em;
  }

  .statusLine{
    margin-bottom:30px;
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }

  .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:currentColor;
    flex-shrink:0;
  }

  .bigBtn,
  .ghostBtn,
  .revealBtn,
  .smallBtn,
  .markBtn{
    border-radius:50px;
    border:1px solid var(--text);
    background:transparent;
    color:var(--text);
    text-transform:uppercase;
    letter-spacing:0.06em;
  }

  .bigBtn{
    font-size:clamp(18px,2vw,22px);
    font-weight:700;
    min-height:64px;
    padding:16px 44px;
  }

  .ghostBtn{
    min-height:54px;
    padding:12px 24px;
    font-size:13px;
    color:var(--muted);
    border-color:var(--line);
  }

  .bigBtn:hover,
  .ghostBtn:hover,
  .revealBtn:hover,
  .smallBtn:hover{
    background:var(--text);
    color:var(--bg);
    border-color:var(--text);
  }

  .titleControls{
    margin-top:14px;
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
  }

  .qNumber{
    font-size:16px;
    text-transform:uppercase;
    letter-spacing:0.12em;
    color:var(--muted);
    margin-bottom:18px;
  }

  .qText{
    margin:0 0 34px;
    font-size:clamp(22px,3.4vw,38px);
    line-height:1.32;
    font-weight:700;
  }

  .qText em{
    font-style:normal;
    font-weight:700;
  }

  .miniBtn{
    min-height:40px;
    padding:8px 10px;
    border:none;
    border-radius:0;
    background:transparent;
    color:var(--muted);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.08em;
  }

  .miniBtn:hover{
    color:var(--text);
  }

  .navCorner{
    position:fixed;
    left:16px;
    bottom:16px;
    z-index:20;
    display:flex;
    gap:8px;
  }
  .scoreCorner{
    position:fixed;
    right:16px;
    bottom:16px;
    z-index:20;
  }

  .revealBtn{
    min-height:58px;
    padding:14px 34px;
    font-size:16px;
    font-weight:700;
  }

  .answerWrap{margin-top:8px; perspective:1200px;}

  .flipCard{
    transform:rotateX(-90deg);
    transform-origin:top center;
    opacity:0;
    transition:transform .5s cubic-bezier(.2,.8,.2,1.1), opacity .35s ease;
  }

  .flipCard.shown{
    transform:rotateX(0deg);
    opacity:1;
  }

  .answerBox{
    background:transparent;
    border:none;
    border-radius:0;
    padding:26px 30px;
    text-align:center;
    box-shadow:none;
  }

  .answerLabel{
    margin-bottom:18px;
    font-size:16px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .answerText{
    font-size:clamp(18px,2.4vw,26px);
    line-height:1.4;
    font-weight:600;
    text-align:center;
  }

  .answerText *{
    background:transparent !important;
    color:inherit !important;
    box-shadow:none !important;
  }

  .answerText a{
    color:var(--text) !important;
    text-decoration:underline;
  }

  .answerText ul{margin:6px 0 0; padding-left:0; list-style:none;}
  .answerText li{margin-bottom:4px; text-align:center; list-style:none;}
  .answerText.listReveal li{
    display:none;
    opacity:0;
    transition:opacity 0.3s ease;
  }
  .answerText.listReveal li.revealed{
    display:block;
    opacity:0;
  }
  .answerText.listReveal li.revealed.show{
    opacity:1;
  }

  .listRevealLoader{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:4px;
    margin-top:8px;
    min-height:18px;
    color:var(--muted);
  }
  .listRevealLoader .dotChar{
    display:inline-block;
    font-size:20px;
    line-height:1;
    animation:listRevealDot 0.9s ease-in-out infinite;
  }
  .listRevealLoader .dotChar:nth-child(2){animation-delay:0.15s;}
  .listRevealLoader .dotChar:nth-child(3){animation-delay:0.3s;}
  .listRevealLoader.done{opacity:0; transition:opacity 0.2s ease;}

  @keyframes listRevealDot{
    0%, 100%{transform:translateY(0); opacity:0.55;}
    35%{transform:translateY(-4px); opacity:1;}
    70%{transform:translateY(0); opacity:0.75;}
  }

  .markRow{
    margin-top:26px;
    display:flex;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
  }

  .markRow.hidden{display:none;}

  .markBtn{
    min-height:56px;
    min-width:180px;
    border-width:2px;
    border-color:var(--line);
    color:var(--muted);
    padding:14px 28px;
    font-size:15px;
    font-weight:700;
    transition:all .15s ease;
  }

  .markBtn.correct:hover,
  .markBtn.correct.active{
    border-color:var(--good);
    color:var(--good);
    background:rgba(76,251,171,0.12);
  }

  .markBtn.incorrect:hover,
  .markBtn.incorrect.active{
    border-color:var(--bad);
    color:var(--bad);
    background:rgba(247,141,167,0.14);
  }

  #scoreboard{
    position:fixed;
    top:14px;
    right:16px;
    background:var(--bg);
    color:var(--muted);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 16px;
    font-size:13px;
    display:none;
    align-items:center;
    gap:8px;
    text-transform:uppercase;
    letter-spacing:0.06em;
  }

  #scoreboard b{
    color:var(--text);
    font-size:16px;
    letter-spacing:normal;
  }

  .crazyToggle{
    position:fixed;
    top:12px;
    left:12px;
    z-index:40;
    min-width:44px;
    height:44px;
    padding:0 10px;
    border-radius:999px;
    border:1px solid rgba(251,226,223,0.25);
    background:rgba(0,7,22,0.22);
    color:rgba(251,226,223,0.5);
    font-size:10px;
    font-weight:700;
    letter-spacing:0.14em;
    text-transform:uppercase;
    line-height:1;
    backdrop-filter:blur(10px);
    opacity:0.3;
    transition:opacity 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }

  .crazyToggle:hover,
  .crazyToggle[aria-pressed="true"]{
    opacity:0.95;
    transform:scale(1.08);
    border-color:rgba(255,255,255,0.78);
    color:#fff;
  }

  .crazyToggle:focus-visible{
    opacity:1;
    outline:3px solid #fff;
    outline-offset:2px;
    box-shadow:0 0 0 6px rgba(0,0,0,0.22), 0 0 22px rgba(255,255,255,0.28);
  }

  body.crazy-mode{
    --bg:#17001f;
    --surface:rgba(18, 7, 34, 0.78);
    --text:#fff9fd;
    --muted:rgba(255,249,253,0.82);
    --line:rgba(123,246,255,0.52);
    --good:#d4ff00;
    --bad:#ff4fd8;
    background:
      linear-gradient(120deg, #ff009d 0%, #6e00ff 20%, #00eaff 42%, #fff000 64%, #ff6a00 82%, #ff009d 100%);
    background-size:300% 300%;
    animation:crazyBackdrop 14s linear infinite;
  }

  body.crazy-mode::before,
  body.crazy-mode::after{
    opacity:1;
    animation:crazyAurora 11s linear infinite alternate;
  }

  body.crazy-mode::after{
    animation-duration:18s;
  }

  body.crazy-mode #progressTrack,
  body.crazy-mode #scoreboard,
  body.crazy-mode .panel,
  body.crazy-mode .answerBox,
  body.crazy-mode textarea,
  body.crazy-mode .smallInput,
  body.crazy-mode details,
  body.crazy-mode .bigBtn,
  body.crazy-mode .ghostBtn,
  body.crazy-mode .revealBtn,
  body.crazy-mode .smallBtn,
  body.crazy-mode .markBtn,
  body.crazy-mode .miniBtn{
    color:#fff;
    border-color:rgba(255,255,255,0.8);
    box-shadow:0 0 0 1px rgba(255,255,255,0.08), 0 18px 38px rgba(20,0,40,0.32);
  }

  body.crazy-mode #progressTrack,
  body.crazy-mode #scoreboard,
  body.crazy-mode .panel,
  body.crazy-mode .answerBox,
  body.crazy-mode textarea,
  body.crazy-mode .smallInput,
  body.crazy-mode details{
    background:linear-gradient(135deg, rgba(18,0,33,0.72), rgba(0,98,255,0.28), rgba(255,0,149,0.34));
    backdrop-filter:blur(12px) saturate(1.3);
  }

  body.crazy-mode .bigBtn,
  body.crazy-mode .ghostBtn,
  body.crazy-mode .revealBtn,
  body.crazy-mode .smallBtn,
  body.crazy-mode .markBtn,
  body.crazy-mode .miniBtn{
    background:linear-gradient(120deg, rgba(255,0,149,0.82), rgba(0,234,255,0.74), rgba(255,230,0,0.78));
    text-shadow:0 1px 0 rgba(0,0,0,0.35);
  }

  body.crazy-mode .bigBtn,
  body.crazy-mode .ghostBtn,
  body.crazy-mode .revealBtn,
  body.crazy-mode .smallBtn,
  body.crazy-mode .markBtn{
    background-size:200% 200%;
    animation:crazyControls 5s linear infinite;
  }

  body.crazy-mode .miniBtn{
    color:#17001f;
  }

  body.crazy-mode .markBtn.correct.active{
    color:#101b00;
    border-color:#f5ff74;
    background:linear-gradient(120deg, #d4ff00, #44ffd2, #f8ff8a);
  }

  body.crazy-mode .markBtn.incorrect.active{
    color:#fff3ff;
    border-color:#ffd0f6;
    background:linear-gradient(120deg, #ff4fd8, #ff8a00, #ff0062);
  }

  body.crazy-mode .markBtn.crazyFloat{
    position:fixed;
    z-index:26;
    max-width:min(260px, 72vw);
    margin:0;
  }

  body.crazy-mode .qText,
  body.crazy-mode .answerText,
  body.crazy-mode .finalScore,
  body.crazy-mode .finalVerdict,
  body.crazy-mode .wordmark{
    text-shadow:0 3px 18px rgba(0,0,0,0.35);
  }

  body.crazy-mode .crazyToggle{
    border-color:rgba(255,255,255,0.8);
    background:linear-gradient(140deg, rgba(255,0,149,0.82), rgba(0,234,255,0.72), rgba(255,230,0,0.72));
    color:#fff;
    box-shadow:0 0 22px rgba(255,255,255,0.26);
  }

  .confettiLayer{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:30;
    overflow:hidden;
  }

  .confettiBurst{
    position:absolute;
    width:0;
    height:0;
  }

  .confettiBurst.left{left:0; bottom:0;}
  .confettiBurst.right{right:0; bottom:0;}

  .confettiPiece{
    position:absolute;
    left:0;
    bottom:0;
    width:8px;
    height:12px;
    border-radius:2px;
    background:var(--piece-color, var(--text));
    transform:translate(0, 0) rotate(0deg);
    animation:confettiFly var(--piece-duration, 2.7s) cubic-bezier(.12,.8,.24,1) forwards;
    animation-delay:var(--piece-delay, 0s);
    opacity:0;
  }

  .confettiBurst.right .confettiPiece{
    left:auto;
    right:0;
  }

  @keyframes confettiFly{
    0%{transform:translate(0, 0) rotate(0deg) scale(0.7); opacity:1;}
    22%{opacity:1;}
    82%{opacity:1;}
    100%{transform:translate(var(--piece-x, 0px), var(--piece-y, -760px)) rotate(var(--piece-rotate, 1440deg)) scale(0.7); opacity:0;}
  }

  .finalScore{
    margin:10px 0 4px;
    font-size:clamp(60px,12vw,140px);
    line-height:1;
    font-weight:700;
  }

  .finalVerdict{
    margin:0 0 10px;
    font-size:clamp(20px,3vw,30px);
    text-transform:uppercase;
  }

  .finalNotes{
    margin:30px auto 0;
    max-width:560px;
    font-size:14px;
    line-height:1.6;
    color:var(--muted);
  }

  .panel{
    max-width:700px;
    margin:0 auto;
    text-align:left;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:30px 34px;
  }

  .panel h2{
    margin:0 0 10px;
    font-size:20px;
    text-transform:uppercase;
  }

  .panel p,
  .panel ol{
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
  }

  .panel ol{padding-left:20px; margin:0 0 18px;}

  .panel code{
    background:rgba(251,226,223,0.08);
    padding:2px 6px;
    border-radius:4px;
    font-size:12.5px;
    color:var(--text);
    word-break:break-all;
  }

  textarea{
    width:100%;
    min-height:120px;
    resize:vertical;
    margin-bottom:12px;
    background:var(--bg);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px;
    font-size:12px;
    font-family:var(--font-main);
  }

  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}

  .smallInput{
    flex:1;
    min-width:220px;
    background:var(--bg);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px 12px;
    font-size:12px;
    font-family:var(--font-main);
  }

  .smallBtn{
    min-height:48px;
    padding:10px 18px;
    border-color:var(--line);
    color:var(--text);
    font-size:12px;
  }

  .smallBtn.secondary{color:var(--muted);}

  details{margin-top:16px;}
  summary{
    cursor:pointer;
    font-size:12px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .inlineErr{
    display:none;
    margin-top:8px;
    font-size:12px;
    color:var(--bad);
  }

  .spinner{
    width:34px;
    height:34px;
    border-radius:50%;
    border:3px solid var(--line);
    border-top-color:var(--text);
    animation:spin 0.9s linear infinite;
    margin:0 auto 24px;
  }

  @keyframes spin{to{transform:rotate(360deg);}}

  @keyframes crazyBackdrop{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }

  @keyframes crazyAurora{
    0%{transform:translate3d(-2%, -1%, 0) rotate(0deg) scale(1);}
    50%{transform:translate3d(3%, 2%, 0) rotate(10deg) scale(1.08);}
    100%{transform:translate3d(-1%, 4%, 0) rotate(-7deg) scale(1.04);}
  }

  @keyframes crazyControls{
    0%{background-position:0% 50%; filter:hue-rotate(0deg);}
    50%{background-position:100% 50%; filter:hue-rotate(28deg);}
    100%{background-position:0% 50%; filter:hue-rotate(0deg);}
  }

  @media (max-width:1024px){
    #stage{padding:10px 5vw 12vh;}
    .markBtn{min-width:160px;}
  }

  @media (max-width:640px){
    #scoreboard{top:10px; right:10px; font-size:12px;}
    .markRow{flex-direction:column; align-items:center;}
    .markBtn{width:100%; max-width:320px;}
    .navCorner{left:10px; bottom:10px;}
    .scoreCorner{right:10px; bottom:10px;}
  }
</style>
</head>
<body>

<button id="crazyToggle" class="crazyToggle" type="button" aria-label="Enable crazy mode" aria-pressed="false" title="Toggle crazy mode">Crazy</button>

<div id="app">
  <div id="progressTrack"><div id="progressFill"></div></div>
  <div id="stage"></div>
</div>

<div id="scoreboard">Score <b id="scoreVal">0</b> / <span id="scoreTotal">0</span></div>

<script>
(function(){
  "use strict";

  const QUIZ_PAGE_URL = "https://theweeklyfifty.com.au/this-weeks-quiz/";
  const DIRECT_QUIZ_API_URL = "https://weeklyfifty-7617b.web.app/api/getLatestQuiz";
  const SAME_ORIGIN_PROXY_API_URL = "/api/getLatestQuiz";

  let slides = [];
  let current = 0;
  let sourceLabel = "";
  let hideLiveScore = false;
  let advanceTimer = null;
  let maxVisitedQuestionIndex = 0;
  let listRevealTimers = [];
  let listRevealLoaderTimer = null;
  let confettiLock = false;
  let crazyResizeTimer = null;
  let crazyMode = false;

  const CRAZY_MODE_STORAGE_KEY = "weekly50-crazy-mode";

  const CRAZY_DISPLAY_FONTS = [
    '"Trebuchet MS", "Comic Sans MS", cursive, sans-serif',
    'Impact, Haettenschweiler, "Arial Black", sans-serif',
    '"Courier New", Courier, monospace',
    '"Georgia", "Times New Roman", serif',
    '"Lucida Console", Monaco, monospace',
    '"Brush Script MT", "Segoe Script", cursive',
    '"Palatino Linotype", "Book Antiqua", Palatino, serif',
    '"Verdana", Geneva, sans-serif',
    '"Arial Rounded MT Bold", "Trebuchet MS", sans-serif'
  ];

  const CRAZY_CONTROL_FONTS = [
    '"Trebuchet MS", Verdana, Arial, sans-serif',
    '"Arial", "Helvetica Neue", Helvetica, sans-serif',
    '"Gill Sans", "Trebuchet MS", sans-serif',
    '"Verdana", Geneva, sans-serif',
    '"Segoe UI", Tahoma, Geneva, sans-serif',
    '"Arial Rounded MT Bold", "Trebuchet MS", sans-serif',
    '"Lucida Sans Unicode", "Lucida Grande", sans-serif'
  ];

  const stage = document.getElementById("stage");
  const progressFill = document.getElementById("progressFill");
  const scoreboard = document.getElementById("scoreboard");
  const scoreVal = document.getElementById("scoreVal");
  const scoreTotal = document.getElementById("scoreTotal");
  const crazyToggle = document.getElementById("crazyToggle");

  function sanitizeFragment(html){
    const doc = new DOMParser().parseFromString("<div>" + html + "</div>", "text/html");
    const root = doc.body.firstChild;
    if (!root) return "";

    root.querySelectorAll("script,style,iframe,object,embed").forEach(el => el.remove());
    root.querySelectorAll("*").forEach(el => {
      Array.from(el.attributes).forEach(attr => {
        const name = attr.name.toLowerCase();
        if (name.startsWith("on") || (name === "href" && /^\s*javascript:/i.test(attr.value))) {
          el.removeAttribute(attr.name);
        }
      });
    });
    return root.innerHTML;
  }

  function parseQuizHTML(html){
    const doc = new DOMParser().parseFromString(html, "text/html");
    const titleEl = doc.querySelector(".quizTitle");
    const title = titleEl ? titleEl.textContent.trim() : "This Week's Fifty";

    const scope = doc.querySelector(".quiz.active") || doc.querySelector(".quizContainer") || doc;
    const qEls = Array.from(scope.querySelectorAll(".question"));

    const questions = qEls.map((q, i) => {
      const qTextEl = q.querySelector(".questionText");
      let number = String(i + 1);
      let questionHTML = "";

      if (qTextEl) {
        const clone = qTextEl.cloneNode(true);
        const bTag = clone.querySelector("b");
        if (bTag) {
          const m = bTag.textContent.match(/(\d+)/);
          if (m) number = m[1];
          bTag.remove();
        }
        questionHTML = sanitizeFragment(clone.innerHTML.trim());
      }

      const answerEl = q.querySelector(".answerText");
      const answerHTML = answerEl
        ? sanitizeFragment(answerEl.innerHTML.trim())
        : "<em>No answer found in source.</em>";

      return { number, questionHTML, answerHTML };
    }).filter(q => q.questionHTML);

    const notesEl = doc.querySelector(".quizNotes");
    const notes = notesEl ? sanitizeFragment(notesEl.innerHTML.trim()) : "";

    return { title, questions, notes };
  }

  function formatDeploymentDate(dateString){
    if (!dateString) return "";
    try {
      return new Intl.DateTimeFormat("en-AU", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        timeZone: "Australia/Adelaide"
      }).format(new Date(dateString));
    } catch (_) {
      return "";
    }
  }

  function parseQuizAPIData(data){
    const quizzes = Array.isArray(data) ? data : [data];
    const quiz = quizzes[0];
    if (!quiz || !Array.isArray(quiz.questions) || !quiz.questions.length) {
      throw new Error("Quiz API response did not contain questions.");
    }

    const quizId = quiz.quizId !== undefined && quiz.quizId !== null ? quiz.quizId : quiz.quiz_id;
    const titleParts = [];
    if (quiz.quizTitle) {
      titleParts.push(String(quiz.quizTitle));
    } else if (quizId !== undefined && quizId !== null) {
      titleParts.push("Quiz " + String(quizId));
    }
    const deployed = formatDeploymentDate(quiz.deploymentDate);
    if (deployed) titleParts.push(deployed);
    const title = titleParts.length ? titleParts.join(" - ") : "This Week's Fifty";

    const questions = quiz.questions.map((q, i) => {
      const rawQ = q.qTitle || q.question || "";
      const rawA = q.qAnswer || q.answer || "<em>No answer found in source.</em>";
      return {
        number: String((q.qNum !== undefined && q.qNum !== null) ? q.qNum : i + 1),
        questionHTML: sanitizeFragment(String(rawQ)),
        answerHTML: sanitizeFragment(String(rawA))
      };
    }).filter(q => q.questionHTML);

    if (!questions.length) {
      throw new Error("Quiz API response had no usable question text.");
    }

    const notes = [quiz.notesAbove, quiz.notesBelow]
      .filter(Boolean)
      .map(val => sanitizeFragment(String(val)))
      .join("<br><br>");

    return { title, questions, notes };
  }

  async function fetchText(url){
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status + " for " + url);
    return res.text();
  }

  async function fetchJSON(url){
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status + " for " + url);
    return res.json();
  }

  function extractQuizAPIURL(pageHTML){
    const direct = pageHTML.match(/fetch\(\s*['\"]([^'\"]*\/api\/getLatestQuiz[^'\"]*)['\"]\s*\)/i);
    if (direct && direct[1]) return direct[1];

    const generic = pageHTML.match(/['\"](https?:\/\/[^'\"]+\/api\/getLatestQuiz[^'\"]*)['\"]/i);
    if (generic && generic[1]) return generic[1];

    throw new Error("Could not find getLatestQuiz endpoint in page source.");
  }

  async function autoLoad(){
    renderLoading();
    try {
      const pageHTML = await fetchText(QUIZ_PAGE_URL);
      const apiURL = extractQuizAPIURL(pageHTML);
      const apiData = await fetchJSON(apiURL);
      const parsed = parseQuizAPIData(apiData);
      buildSlides(parsed, "Loaded from " + apiURL);
      renderCurrent();
      return;
    } catch (discoverErr) {
      try {
        const apiDataDirect = await fetchJSON(DIRECT_QUIZ_API_URL);
        const parsedDirect = parseQuizAPIData(apiDataDirect);
        buildSlides(parsedDirect, "Loaded from " + DIRECT_QUIZ_API_URL);
        renderCurrent();
        return;
      } catch (directErr) {
        try {
          const apiDataProxy = await fetchJSON(SAME_ORIGIN_PROXY_API_URL);
          const parsedProxy = parseQuizAPIData(apiDataProxy);
          buildSlides(parsedProxy, "Loaded from local proxy");
          renderCurrent();
          return;
        } catch (proxyErr) {
          const details =
            "discovery: " + (discoverErr && discoverErr.message ? discoverErr.message : String(discoverErr)) +
            " | direct: " + (directErr && directErr.message ? directErr.message : String(directErr)) +
            " | proxy: " + (proxyErr && proxyErr.message ? proxyErr.message : String(proxyErr));
          renderLoadError(new Error(details));
        }
      }
    }
  }

  function buildSlides(parsed, label){
    sourceLabel = label;
    slides = [];
    slides.push({ type: "title", title: parsed.title, notes: parsed.notes });
    parsed.questions.forEach(q => {
      slides.push({
        type: "question",
        number: q.number,
        questionHTML: q.questionHTML,
        answerHTML: q.answerHTML,
        revealed: false,
        listRevealPending: false,
        mark: null,
        crazyButtonLayout: null
      });
    });
    slides.push({ type: "final" });
    current = 0;
    maxVisitedQuestionIndex = 0;
  }

  function clearAutoAdvance(){
    if (advanceTimer) {
      clearTimeout(advanceTimer);
      advanceTimer = null;
    }
  }

  function clearListRevealTimers(){
    listRevealTimers.forEach(timer => clearTimeout(timer));
    listRevealTimers = [];

    }

  function launchConfettiCannon(){
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    if (confettiLock) return;

    confettiLock = true;

    const layer = document.createElement("div");
    layer.className = "confettiLayer";

    const colors = ["#fbe2df", "#4cfbab", "#f78da7", "#ffd166", "#8ecae6"];
    const burstConfigs = [
      {
        side: "left",
        horizontalBase: [280, 640],
        verticalBase: [-420, -980]
      },
      {
        side: "right",
        horizontalBase: [280, 640],
        verticalBase: [-420, -980]
      }
    ];

    burstConfigs.forEach(config => {
      const burst = document.createElement("div");
      burst.className = "confettiBurst " + config.side;

      const pieceCount = 52;
      for (let index = 0; index < pieceCount; index++) {
        const piece = document.createElement("span");
        const spreadX = config.horizontalBase[0] + Math.random() * (config.horizontalBase[1] - config.horizontalBase[0]);
        const spreadY = config.verticalBase[0] - Math.random() * (Math.abs(config.verticalBase[1]) - Math.abs(config.verticalBase[0]));
        const directionJitter = config.side === "left" ? 1 : -1;
        const skew = (Math.random() > 0.5 ? 1 : -1) * (240 + Math.random() * 900);
        const shapeSeed = index % 5;

        piece.className = "confettiPiece";
        piece.style.setProperty("--piece-color", colors[index % colors.length]);
        piece.style.setProperty("--piece-x", (spreadX * directionJitter) + "px");
        piece.style.setProperty("--piece-y", spreadY + "px");
        piece.style.setProperty("--piece-rotate", skew + "deg");
        piece.style.setProperty("--piece-duration", (2.1 + Math.random() * 1.1) + "s");
        piece.style.setProperty("--piece-delay", (Math.random() * 0.16) + "s");
        piece.style.left = (6 + Math.random() * 24) + "px";
        piece.style.bottom = (6 + Math.random() * 16) + "px";
        piece.style.width = (5 + Math.random() * 6) + "px";
        piece.style.height = (7 + Math.random() * 8) + "px";
        piece.style.transform = "rotate(" + (Math.random() * 70 - 35) + "deg)";

        if (shapeSeed === 0) {
          piece.style.borderRadius = "999px";
          piece.style.height = (6 + Math.random() * 7) + "px";
          piece.style.width = (6 + Math.random() * 8) + "px";
        } else if (shapeSeed === 1) {
          piece.style.borderRadius = "2px";
        } else if (shapeSeed === 2) {
          piece.style.borderRadius = "0";
          piece.style.clipPath = "polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)";
        } else if (shapeSeed === 3) {
          piece.style.borderRadius = "0";
          piece.style.clipPath = "polygon(50% 0%, 100% 100%, 0% 100%)";
        } else {
          piece.style.borderRadius = "999px 2px 999px 2px";
        }

        burst.appendChild(piece);
      }

      layer.appendChild(burst);
    });

    document.body.appendChild(layer);

    window.setTimeout(() => {
      layer.remove();
      confettiLock = false;
    }, 4400);
  }

  function reserveListRevealHeight(answerText){
    const clone = answerText.cloneNode(true);
    clone.classList.remove("listReveal");
    clone.querySelectorAll("li").forEach(li => {
      li.style.display = "block";
      li.style.opacity = "1";
    });
    clone.querySelectorAll(".listRevealLoader").forEach(loader => loader.remove());
    clone.style.position = "absolute";
    clone.style.visibility = "hidden";
    clone.style.pointerEvents = "none";
    clone.style.left = "-9999px";
    clone.style.top = "0";
    clone.style.width = Math.ceil(answerText.getBoundingClientRect().width) + "px";
    clone.style.minHeight = "0";
    clone.style.height = "auto";
    document.body.appendChild(clone);
    const height = clone.getBoundingClientRect().height;
    clone.remove();
    answerText.style.minHeight = height + "px";

  function setupListReveal(slide){
    clearListRevealTimers();

    if (!slide.listRevealPending) return;

    const answerText = stage.querySelector(".answerText");
    const markRow = stage.querySelector(".markRow");
    if (!answerText) return;

    const items = Array.from(answerText.querySelectorAll("li"));
    if (!items.length) {
      if (markRow) markRow.classList.remove("hidden");
      return;
    }

    answerText.classList.add("listReveal");

    const loader = document.createElement("div");
    loader.className = "listRevealLoader";
    loader.innerHTML = '<span class="dotChar">.</span><span class="dotChar">.</span><span class="dotChar">.</span>';
    answerText.appendChild(loader);
    reserveListRevealHeight(answerText);

    const revealItem = (item) => {
      item.classList.add("revealed");
      window.requestAnimationFrame(() => {
        item.classList.add("show");
      });
    };

    revealItem(items[0]);

    for (let index = 1; index < items.length; index++) {
      const item = items[index];
      const timer = window.setTimeout(() => {
        revealItem(item);

        if (index === items.length - 1) {
          listRevealLoaderTimer = window.setTimeout(() => {
            loader.classList.add("done");
            if (markRow) markRow.classList.remove("hidden");
            listRevealLoaderTimer = null;
          }, 350);
        }
      }, index * 2000);
      listRevealTimers.push(timer);
    }

    slide.listRevealPending = false;
  }

  function scheduleAutoAdvance(){
    clearAutoAdvance();
    const prefersReduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const delayMs = prefersReduced ? 250 : 700;
    const atIndex = current;

    advanceTimer = setTimeout(() => {
      const slide = slides[atIndex];
      if (current === atIndex && slide && slide.type === "question" && slide.revealed && slide.mark) {
        goTo(atIndex + 1);
      }
    }, delayMs);
  }

  function escapeHTML(str){
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;

  function syncCrazyToggle(){
    crazyToggle.setAttribute("aria-pressed", crazyMode ? "true" : "false");
    crazyToggle.setAttribute("aria-label", crazyMode ? "Disable crazy mode" : "Enable crazy mode");
    crazyToggle.title = crazyMode ? "Disable crazy mode" : "Enable crazy mode";
  }

  function randomCrazyFont(){
    return CRAZY_DISPLAY_FONTS[Math.floor(Math.random() * CRAZY_DISPLAY_FONTS.length)];
  }

  function randomCrazyControlFont(){
    return CRAZY_CONTROL_FONTS[Math.floor(Math.random() * CRAZY_CONTROL_FONTS.length)];
  }

  function setFontOnSelector(root, selector, font){
    if (root.matches && root.matches(selector)) {
      root.style.fontFamily = font;
      root.setAttribute("data-crazy-font", "true");
    }
    if (!root.querySelectorAll) return;
    root.querySelectorAll(selector).forEach(el => {
      if (el.tagName === "SCRIPT" || el.tagName === "STYLE") return;
      el.style.fontFamily = font;
      el.setAttribute("data-crazy-font", "true");
    });
  }

  function randomizeFontsInRoots(roots){
    const groups = [
      { selector: "body", font: randomCrazyFont() },
      { selector: "#scoreboard, #scoreboard *", font: randomCrazyControlFont() },
      { selector: "#crazyToggle, button, input, textarea, summary, code", font: randomCrazyControlFont() },
      { selector: ".wordmark, .subtitle, .qNumber, .finalScore, .finalVerdict", font: randomCrazyFont() },
      { selector: ".qText, .qText *, .answerLabel, .answerText, .answerText *, .finalNotes, .statusLine, .panel h2, .panel p, .panel li", font: randomCrazyFont() }
    ];

    roots.forEach(root => {
      groups.forEach(group => {
        setFontOnSelector(root, group.selector, group.font);
      });

      if (!root.querySelectorAll) return;
      root.querySelectorAll("*:not([data-crazy-font])").forEach(el => {
        if (el.tagName === "SCRIPT" || el.tagName === "STYLE") return;
        el.style.fontFamily = randomCrazyFont();
        el.setAttribute("data-crazy-font", "true");
      });
    });
  }

  function clearCrazyFonts(){
    document.querySelectorAll("[data-crazy-font]").forEach(el => {
      el.style.fontFamily = "";
      el.removeAttribute("data-crazy-font");
    });
    document.body.style.fontFamily = "";
  }

  function clearCrazyButtonLayout(){
    stage.querySelectorAll(".markBtn").forEach(btn => {
      btn.classList.remove("crazyFloat");
      btn.style.left = "";
      btn.style.top = "";
      btn.style.width = "";
    });

  function expandRect(rect, padding){
    return {
      left: rect.left - padding,
      top: rect.top - padding,
      right: rect.right + padding,
      bottom: rect.bottom + padding
    };
  }

  function rectsOverlap(a, b){
    return !(a.right <= b.left || a.left >= b.right || a.bottom <= b.top || a.top >= b.bottom);
  }

  function chooseCrazyButtonSpot(size, reservedRects, placedRects){
    const viewportWidth = window.innerWidth;
    const viewportHeight = window.innerHeight;
    const xRange = Math.max(1, viewportWidth - size.width - 24);
    const yRange = Math.max(1, viewportHeight - size.height - 82);

    for (let attempt = 0; attempt < 120; attempt++) {
      const left = 12 + Math.random() * xRange;
      const top = 58 + Math.random() * yRange;
      const rect = { left, top, right: left + size.width, bottom: top + size.height };
      if (reservedRects.some(area => rectsOverlap(rect, area))) continue;
      if (placedRects.some(area => rectsOverlap(rect, area))) continue;
      return { left, top, rect };
    }

    const fallbackSpots = [
      { left: 12, top: Math.max(58, viewportHeight - size.height - 20) },
      { left: Math.max(12, viewportWidth - size.width - 12), top: Math.max(58, viewportHeight - size.height - 20) },
      { left: 12, top: 82 },
      { left: Math.max(12, viewportWidth - size.width - 12), top: 82 }
    ];

    for (let index = 0; index < fallbackSpots.length; index++) {
      const spot = fallbackSpots[index];
      const rect = { left: spot.left, top: spot.top, right: spot.left + size.width, bottom: spot.top + size.height };
      if (reservedRects.some(area => rectsOverlap(rect, area))) continue;
      if (placedRects.some(area => rectsOverlap(rect, area))) continue;
      return { left: spot.left, top: spot.top, rect };
    }

    return {
      left: 12,
      top: Math.max(58, viewportHeight - size.height - 20),
      rect: { left: 12, top: Math.max(58, viewportHeight - size.height - 20), right: 12 + size.width, bottom: Math.max(58, viewportHeight - size.height - 20) + size.height }
    };
  }

  function computeCrazyButtonLayout(){
    const buttons = Array.from(stage.querySelectorAll(".markBtn"));
    if (!buttons.length) return [];

    const qText = stage.querySelector(".qText");
    const answerWrap = stage.querySelector(".answerWrap");
    const qNumber = stage.querySelector(".qNumber");
    const navCorner = stage.querySelector(".navCorner");
    const reservedRects = [];

    if (qNumber) reservedRects.push(expandRect(qNumber.getBoundingClientRect(), 18));
    if (qText) reservedRects.push(expandRect(qText.getBoundingClientRect(), 24));
    if (answerWrap) reservedRects.push(expandRect(answerWrap.getBoundingClientRect(), 20));
    if (navCorner) reservedRects.push(expandRect(navCorner.getBoundingClientRect(), 18));
    if (scoreboard.style.display !== "none") reservedRects.push(expandRect(scoreboard.getBoundingClientRect(), 18));
    reservedRects.push(expandRect(crazyToggle.getBoundingClientRect(), 18));

    const placedRects = [];

    return buttons.map(btn => {
      const rect = btn.getBoundingClientRect();
      const size = {
        width: Math.max(Math.ceil(rect.width), 156),
        height: Math.max(Math.ceil(rect.height), 52)
      };
      const spot = chooseCrazyButtonSpot(size, reservedRects, placedRects);
      placedRects.push(spot.rect);
      return { left: spot.left, top: spot.top, width: size.width };
    });
  }

  function applyCrazyButtonLayout(slide){
    const buttons = Array.from(stage.querySelectorAll(".markBtn"));
    if (!buttons.length) return;

    const viewportKey = window.innerWidth + "x" + window.innerHeight;
    const contentKey = slide.number + "|" + slide.revealed + "|" + slide.questionHTML.length + "|" + slide.answerHTML.length;
    if (!slide.crazyButtonLayout || slide.crazyButtonLayout.viewportKey !== viewportKey || slide.crazyButtonLayout.contentKey !== contentKey) {
      slide.crazyButtonLayout = {
        viewportKey,
        contentKey,
        positions: computeCrazyButtonLayout()
      };
    }

    buttons.forEach((btn, index) => {
      const spot = slide.crazyButtonLayout.positions[index];
      if (!spot) return;
      btn.classList.add("crazyFloat");
      btn.style.left = spot.left + "px";
      btn.style.top = spot.top + "px";
      btn.style.width = spot.width + "px";
    });
  }

  function refreshCrazyPresentation(options){
    const settings = options || {};
    document.body.classList.toggle("crazy-mode", crazyMode);
    syncCrazyToggle();

    if (!crazyMode) {
      clearCrazyFonts();
      clearCrazyButtonLayout();
      return;
    }

    if (settings.rerandomizeFonts) {
      randomizeFontsInRoots(settings.fontRoots || [document.body]);
    }
    const slide = slides[current];
    if (slide && slide.type === "question" && slide.revealed) {
      applyCrazyButtonLayout(slide);
    } else {
      clearCrazyButtonLayout();
    }
  }

  function setCrazyMode(enabled){
    crazyMode = !!enabled;
    try {
      window.localStorage.setItem(CRAZY_MODE_STORAGE_KEY, crazyMode ? "true" : "false");
    } catch (_) {}
    if (slides.length && slides[current] && slides[current].type === "question") {
      slides[current].crazyButtonLayout = null;
    }
    refreshCrazyPresentation({ rerandomizeFonts: crazyMode, fontRoots: [document.body] });
  }

  function totalQuestions(){
    return slides.filter(s => s.type === "question").length;
  }

  function scoreSoFar(){
    return slides.filter(s => s.type === "question" && s.mark === "correct").length;
  }

  function updateChrome(){
    const slide = slides[current];
    if (slide.type === "title") {
      progressFill.style.width = "0%";
      scoreboard.style.display = "none";
      return;
    }

    if (slide.type === "final") {
      progressFill.style.width = "100%";
      scoreboard.style.display = "none";
      return;
    }

    const qSlides = slides.filter(s => s.type === "question");
    const idx = qSlides.indexOf(slide) + 1;
    progressFill.style.width = (idx / qSlides.length * 100) + "%";
    scoreboard.style.display = hideLiveScore ? "none" : "flex";
    scoreVal.textContent = scoreSoFar();
    scoreTotal.textContent = totalQuestions();
  }

  function renderCurrent(){
    const slide = slides[current];
    updateChrome();
    clearListRevealTimers();

    if (slide.type === "title") {
      stage.innerHTML =
        '<div class="slideInner">' +
          '<h1 class="wordmark">The Weekly Fifty</h1>' +
          '<p class="subtitle">' + escapeHTML(slide.title) + '</p>' +
          '<button class="bigBtn" id="startBtn" type="button">Start Quiz</button>' +
        '</div>';

      document.getElementById("startBtn").addEventListener("click", () => goTo(current + 1));
      refreshCrazyPresentation({ rerandomizeFonts: true, fontRoots: [stage, scoreboard, progressFill.parentElement, crazyToggle] });
      return;
    }

    if (slide.type === "question") {
      const canGoNext = current < maxVisitedQuestionIndex && slides[current + 1] && slides[current + 1].type === "question";
      stage.innerHTML =
        '<div class="slideInner">' +
          '<div class="navCorner">' +
            '<button class="miniBtn" id="backBtn" type="button">Back</button>' +
            (canGoNext ? '<button class="miniBtn" id="nextBtn" type="button">Next</button>' : '') +
          '</div>' +
          '<button class="miniBtn scoreCorner" id="toggleScoreBtnQ" type="button">Live Score: ' + (hideLiveScore ? "Hidden" : "Visible") + '</button>' +
          '<div class="qNumber">Question ' + slide.number + '</div>' +
          '<div class="qText">' + slide.questionHTML + '</div>' +
          (
            slide.revealed
              ? '<div class="answerWrap"><div class="flipCard shown"><div class="answerBox">' +
                  '<div class="answerLabel">Answer</div>' +
                  '<div class="answerText">' + slide.answerHTML + '</div>' +
                '</div></div></div>' +
                '<div class="markRow' + (slide.listRevealPending ? ' hidden' : '') + '">' +
                  '<button class="markBtn correct' + (slide.mark === "correct" ? " active" : "") + '" data-mark="correct" type="button">Correct</button>' +
                  '<button class="markBtn incorrect' + (slide.mark === "incorrect" ? " active" : "") + '" data-mark="incorrect" type="button">Incorrect</button>' +
                '</div>'
              : '<button class="revealBtn" id="revealBtn" type="button">Reveal Answer</button>'
          ) +
        '</div>';

      const rb = document.getElementById("revealBtn");
      if (rb) rb.addEventListener("click", reveal);

      const backBtn = document.getElementById("backBtn");
      if (backBtn) backBtn.addEventListener("click", () => goTo(current - 1));

      const nextBtn = document.getElementById("nextBtn");
      if (nextBtn) nextBtn.addEventListener("click", () => goTo(current + 1));

      const toggleScoreBtnQ = document.getElementById("toggleScoreBtnQ");
      if (toggleScoreBtnQ) {
        toggleScoreBtnQ.addEventListener("click", () => {
          hideLiveScore = !hideLiveScore;
          renderCurrent();
        });
      }

      stage.querySelectorAll(".markBtn").forEach(btn => {
        btn.addEventListener("click", () => mark(btn.dataset.mark));
      });

      setupListReveal(slide);
      refreshCrazyPresentation({ rerandomizeFonts: true, fontRoots: [stage, scoreboard, progressFill.parentElement, crazyToggle] });
      return;
    }

    if (slide.type === "final") {
      const total = totalQuestions();
      const score = scoreSoFar();
      const pct = total ? (score / total * 100) : 0;
      let verdict;

      if (pct >= 90) verdict = "Certified Fifty legends.";
      else if (pct >= 70) verdict = "Cracking effort.";
      else if (pct >= 50) verdict = "Solid showing.";
      else if (pct >= 30) verdict = "Roughly fifty-fifty.";
      else verdict = "Tough night, next week is yours.";

      const titleSlide = slides[0];
      stage.innerHTML =
        '<div class="slideInner">' +
          '<div class="qNumber">Final Score</div>' +
          '<div class="finalScore">' + score + ' / ' + total + '</div>' +
          '<div class="finalVerdict">' + verdict + '</div>' +
          (titleSlide.notes ? '<div class="finalNotes">' + titleSlide.notes + '</div>' : "") +
          '<button class="ghostBtn" id="restartBtn" type="button">Restart Quiz</button>' +
        '</div>';

      document.getElementById("restartBtn").addEventListener("click", () => {
        slides.forEach(s => {
          if (s.type === "question") {
            s.revealed = false;
            s.mark = null;
            s.confettiTriggered = false;
            s.listRevealPending = false;
            s.crazyButtonLayout = null;
          }
        });
        clearAutoAdvance();
        goTo(0);
      });
      refreshCrazyPresentation({ rerandomizeFonts: true, fontRoots: [stage, scoreboard, progressFill.parentElement, crazyToggle] });
    }
  }

  function reveal(){
    const slide = slides[current];
    if (slide.type !== "question") return;
    slide.revealed = true;
    slide.listRevealPending = true;
    renderCurrent();
  }

  function mark(value){
    const slide = slides[current];
    if (slide.type !== "question" || !slide.revealed) return;
    slide.mark = value;
    if ((String(slide.number) === "25" || String(slide.number) === "50") && !slide.confettiTriggered) {
      slide.confettiTriggered = true;
      launchConfettiCannon();
    }
    renderCurrent();
    scheduleAutoAdvance();
  }

  function goTo(index){
    if (index < 0 || index >= slides.length) return;
    clearAutoAdvance();
    current = index;
    if (slides[current] && slides[current].type === "question" && current > maxVisitedQuestionIndex) {
      maxVisitedQuestionIndex = current;
    }
    renderCurrent();
  }

  document.addEventListener("keydown", (e) => {
    if (!slides.length) return;
    const slide = slides[current];

    if (e.code === "Space" || e.code === "ArrowRight") {
      e.preventDefault();
      if (slide.type === "title") goTo(current + 1);
      else if (slide.type === "question") {
        if (!slide.revealed) reveal();
        else goTo(current + 1);
      }
    } else if (e.code === "ArrowLeft") {
      e.preventDefault();
      goTo(current - 1);
    } else if (e.key === "c" || e.key === "C") {
      if (slide.type === "question" && slide.revealed) mark("correct");
    } else if (e.key === "x" || e.key === "X") {
      if (slide.type === "question" && slide.revealed) mark("incorrect");
    }
  });

  let touchStartX = 0;
  let touchStartY = 0;

  document.addEventListener("touchstart", (e) => {
    if (!e.changedTouches || !e.changedTouches[0]) return;
    touchStartX = e.changedTouches[0].clientX;
    touchStartY = e.changedTouches[0].clientY;
  }, { passive: true });

  document.addEventListener("touchend", (e) => {
    if (!slides.length || !e.changedTouches || !e.changedTouches[0]) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;

    if (Math.abs(dx) < 60 || Math.abs(dy) > 40) return;
    if (dx < 0) goTo(current + 1);
    if (dx > 0) goTo(current - 1);
  }, { passive: true });

  window.addEventListener("resize", () => {
    if (!crazyMode) return;
    if (crazyResizeTimer) clearTimeout(crazyResizeTimer);
    crazyResizeTimer = window.setTimeout(() => {
      crazyResizeTimer = null;
      if (slides.length && slides[current] && slides[current].type === "question") {
        slides[current].crazyButtonLayout = null;
      }
      refreshCrazyPresentation();
    }, 120);
  });

  crazyToggle.addEventListener("click", () => {
    setCrazyMode(!crazyMode);
  });

  try {
    crazyMode = window.localStorage.getItem(CRAZY_MODE_STORAGE_KEY) === "true";
  } catch (_) {
    crazyMode = false;
  }
  syncCrazyToggle();
  autoLoad();
})();
</script>
</body>
</html>
